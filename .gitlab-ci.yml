image: node:20.17.0

stages:
  - install
  - lint
  - build
# - test

variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/cache/yarn'

.rules:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event")

install:
  stage: install
  interruptible: true
  rules:
    - !reference [.rules, rules]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - cache/yarn
      - node_modules
    policy: push
  needs: []
  script:
    - yarn install --frozen-lockfile

format:
  stage: lint
  interruptible: true
  rules:
    - !reference [.rules, rules]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - cache/yarn
      - node_modules
    policy: pull
  needs: [install]
  script:
    - yarn format:check

lint:
  stage: lint
  interruptible: true
  rules:
    - !reference [.rules, rules]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - cache/yarn
      - node_modules
    policy: pull
  needs: [install]
  script:
    - yarn lint

