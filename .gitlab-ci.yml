build-frontend:
  stage: build
  interruptible: true
  rules:
    - !reference [.rules, rules]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - cache/yarn
      - node_modules
    policy: pull
  needs: [install]
  script:
    - yarn frontend build

build-backend:
  stage: build
  interruptible: true
  rules:
    - !reference [.rules, rules]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - cache/yarn
      - node_modules
    policy: pull
  needs: [install]
  script:
    - yarn backend build
